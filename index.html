<!DOCTYPE html>
<html lang="en">
<head>
    <title>Cane Race</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.4/howler.min.js"></script>
    <script src="game.js?v=20260317"></script>
</head>
<body>

<h1>Cane Race</h1>
<a href="help.html" target="_blank">How to Play</a><br>
<div style="height: 0.75rem;"></div>
<button id="play" onclick="startGame()">Play the Game!</button>
<div id="hud" role="status" aria-live="polite">
    <h2>Score</h2>
    <div id="scoreValue">0</div>
    <h2>Coins</h2>
    <div id="coinTotalValue">0</div>
</div>
<div id="gameArea" tabindex="-1" role="application" aria-live="polite" style="outline: none;"></div>
<div id="status" aria-live="assertive" aria-atomic="true"></div>

</body>
</html>
